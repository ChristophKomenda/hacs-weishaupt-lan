name: Heating Circuit Discovery

on:
  push:
    branches:
      - feat/heating-circuit-discovery
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax:
    name: PowerShell syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate scanner syntax
        shell: pwsh
        run: |
          $path = "discoverytool/heating-circuit/heating-circuit-discovery.ps1"
          $tokens = $null
          $errors = $null

          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
          )

          if ($errors.Count -gt 0) {
              foreach ($errorItem in $errors) {
                  Write-Error "Line $($errorItem.Extent.StartLineNumber): $($errorItem.Message)"
              }
              exit 1
          }

          Write-Host "PowerShell syntax: OK"
          Write-Host "Parsed tokens: $($tokens.Count)"

      - name: Validate heating circuit probe plan
        shell: pwsh
        run: |
          $path = "discoverytool/heating-circuit/heating-circuit-discovery.ps1"
          $tokens = $null
          $errors = $null

          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
          )

          if ($errors.Count -gt 0) {
              throw "Scanner contains PowerShell syntax errors."
          }

          $names = @(
              "Get-ModuleContext",
              "New-GetFrame",
              "Add-PlanFrame",
              "New-ProbePlan"
          )

          foreach ($name in $names) {
              $functionAst = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq $name
              }, $true)

              if ($null -eq $functionAst) {
                  throw "Missing function: $name"
              }

              $body = $functionAst.Body.Extent.Text
              $body = $body.Substring(1, $body.Length - 2)
              Set-Item -Path "Function:\script:$name" `
                  -Value ([scriptblock]::Create($body))
          }

          $plan = @(New-ProbePlan -SelectedProfile "HeatingCircuit" -SelectedModules @(0))

          if ($plan.Count -ne 4) {
              throw "Expected 4 frames, got $($plan.Count)"
          }

          $expected = @(
              "010200253302000100",
              "010200258202000100",
              "01020025590200020000",
              "01020025070200020000"
          )

          $actual = @($plan | ForEach-Object { $_.RequestVG })

          foreach ($frame in $expected) {
              if ($frame -cnotin $actual) {
                  throw "Missing expected frame: $frame"
              }
          }

          if (@($actual | Select-Object -Unique).Count -ne 4) {
              throw "Duplicate frames detected."
          }

          Write-Host "HeatingCircuit probe plan: PASS"
          Write-Host "4 unique HK1 GET frames validated."

      - name: Validate HeatingCircuitV2
        shell: pwsh
        run: |
          $path = "discoverytool/heating-circuit/heating-circuit-discovery.ps1"
          $tokens = $null
          $errors = $null

          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
          )

          if ($errors.Count -gt 0) {
              throw "PowerShell syntax errors detected."
          }

          $names = @(
              "Get-ModuleContext",
              "New-GetFrame",
              "Add-PlanFrame",
              "New-ProbePlan"
          )

          foreach ($name in $names) {
              $fn = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq $name
              }, $true)

              if ($null -eq $fn) {
                  throw "Missing function: $name"
              }

              $body = $fn.Body.Extent.Text
              $body = $body.Substring(1, $body.Length - 2)
              Set-Item -Path "Function:\script:$name" `
                  -Value ([scriptblock]::Create($body))
          }

          $plan = @(New-ProbePlan -SelectedProfile "HeatingCircuitV2" -SelectedModules @(0))

          if ($plan.Count -ne 5) {
              throw "Expected 5 frames, got $($plan.Count)"
          }

          $expected = @(
              "010200253302000100",
              "010200258202000100",
              "01020025590200020000",
              "01020025070200020000",
              "010901261902000100"
          )

          $actual = @($plan | ForEach-Object { $_.RequestVG })

          foreach ($frame in $expected) {
              if ($frame -cnotin $actual) {
                  throw "Missing frame: $frame"
              }
          }

          if (@($actual | Select-Object -Unique).Count -ne 5) {
              throw "Duplicate frames detected."
          }

          foreach ($frame in $actual) {
              if (-not $frame.StartsWith("01")) {
                  throw "Non-GET frame detected: $frame"
              }
          }

          Write-Host "HeatingCircuitV2: PASS"
          Write-Host "5 unique read-only frames validated."
